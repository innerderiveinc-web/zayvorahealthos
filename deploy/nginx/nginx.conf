# ==============================================================================
# ZMIE Production NGINX Reverse Proxy & SSL Gateway
# High-Performance, Rate-Limited, Zero-Trust Healthcare Gateway
# ==============================================================================

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream latency
    log_format zmie_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log zmie_combined;
    error_log  /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 64M;

    # Gzip Compression for Clinical Catalog & Payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # Rate Limiting Zones (DDoS and Resource Protection)
    limit_req_zone $binary_remote_addr zone=zmie_api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=zmie_auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=zmie_conn_limit:10m;

    # Upstream FastAPI Engine Cluster
    upstream zmie_engine {
        server engine:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP to HTTPS Redirect Server
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Production Gateway
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost zmie.internal api.zmie.ai;

        # Self-signed fallback or Let's Encrypt certificates
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS Hardening (A+ SSL Labs profile)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Enterprise Security Headers (HIPAA & NIST Compliant)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: ws: wss:;" always;

        # Connection concurrency limits
        limit_conn zmie_conn_limit 20;

        # 1. Static Clinical Seed Cache (Fast Edge Delivery)
        location = /catalog_seed.json {
            proxy_pass http://zmie_engine/catalog_seed.json;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1h;
            add_header Cache-Control "public, max-age=3600, immutable";
        }

        # 2. Service Worker Delivery
        location = /sw.js {
            proxy_pass http://zmie_engine/sw.js;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 3. Healthcheck Endpoint (Bypass Rate Limiting for K8s/Docker)
        location /health {
            proxy_pass http://zmie_engine/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # 4. Auth & Ring Access Endpoints (Strict Rate Limiting)
        location /api/v1/controlled-launch/rings {
            limit_req zone=zmie_auth_limit burst=10 nodelay;
            proxy_pass http://zmie_engine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. General REST API & Web Workbench Routing
        location / {
            limit_req zone=zmie_api_limit burst=50 nodelay;

            proxy_pass http://zmie_engine;
            proxy_http_version 1.1;

            # WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for deep clinical research operations
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
