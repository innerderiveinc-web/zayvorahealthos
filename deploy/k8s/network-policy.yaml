apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zmie-default-zero-trust
  namespace: zmie-production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from within the zmie-production namespace
    - from:
        - podSelector: {}
    # Allow ingress controller traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow internal communication with DBs/Cache/MinIO
    - to:
        - podSelector: {}
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTPS to authenticated biomedical data sources
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
