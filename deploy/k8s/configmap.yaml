apiVersion: v1
kind: ConfigMap
metadata:
  name: zmie-engine-config
  namespace: zmie-production
data:
  ZMIE_ENV: "production"
  NEO4J_URI: "bolt://neo4j.zmie-production.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  REDIS_URL: "redis://redis.zmie-production.svc.cluster.local:6379/0"
  MINIO_ENDPOINT: "minio.zmie-production.svc.cluster.local:9000"
  OPENSEARCH_URL: "http://opensearch.zmie-production.svc.cluster.local:9200"
  LOG_LEVEL: "INFO"
