name: ZMIE CI/CD Quality & Zero-Hallucination Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-engine:
    name: Verify Engine, Agents & Zero-Hallucination Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings httpx asyncpg neo4j redis sqlalchemy greenlet pypdf python-dotenv

      - name: Run Complete Automated Verification Suite (537 Tests)
        run: |
          PYTHONPATH=services/engine:sdk/python python -m unittest discover -s tests -p "test_*.py"

      - name: Run Master 9-Pillar End-to-End Verification
        run: |
          PYTHONPATH=services/engine python examples/master_showcase.py

      - name: Run Quantitative Adversarial & Safety Evaluation Suite
        run: |
          PYTHONPATH=services/engine python services/engine/app/core/eval_suite.py
