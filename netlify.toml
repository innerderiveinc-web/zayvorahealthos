# Netlify Deployment Configuration for ZMIE
# ZAYVORA Medical Intelligence Engine (Production Ready)

[build]
  publish = "."

[[redirects]]
  from = "/workbench"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/workbench/*"
  to = "/index.html"
  status = 200

# Backend API Proxy (Optional for Static Edge Deployments):
# By default, ZMIE Workbench functions in offline-first mode using the local client catalog.
# To connect a Netlify static frontend to an external ZMIE FastAPI backend service
# (e.g., on Fly.io, AWS, Render, or GCP Cloud Run), uncomment the proxy rule below:
# [[redirects]]
#   from = "/v1/*"
#   to = "https://your-zmie-backend-service.com/v1/:splat"
#   status = 200
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/catalog_seed.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/json; charset=utf-8"
