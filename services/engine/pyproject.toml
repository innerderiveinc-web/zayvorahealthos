[project]
name = "zmie-engine"
version = "1.0.0"
description = "ZMIE — ZAYVORA Medical Intelligence Engine Core Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.29",
    "neo4j>=5.19.0",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "minio>=7.2.5",
    "pgvector>=0.2.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
